<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proses Gaji Berkala</title>

<style>
:root{
  --blue:#2563eb;
  --orange:#f59e0b;
  --green:#16a34a;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  background:#ffffff;
  padding:16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.badge{
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  color:#fff;
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

header strong{
  font-size:16px;
}

/* MAIN */
.main{
  padding:18px;
  max-width:640px;
  margin:auto;
}

/* NOTICE */
.notice{
  background:#fff7ed;
  border-left:6px solid var(--orange);
  padding:14px;
  border-radius:14px;
  font-size:14px;
  font-weight:700;
  margin-bottom:18px;
}

/* BUTTON LIST */
.actions{
  display:grid;
  gap:14px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
  border-radius:18px;
  text-decoration:none;
  color:#fff;
  font-size:16px;
  font-weight:900;
  transition:.2s ease;
}

.btn small{
  background:rgba(255,255,255,.25);
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
}

.btn:hover{
  transform:translateY(-2px);
}

/* COLOR VARIANTS */
.btn-kgb{
  background:linear-gradient(135deg,#60a5fa,#2563eb);
}

.btn-bkd{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
}

/* INFO BOX */
.info{
  margin-top:16px;
  background:#ffffff;
  padding:14px;
  border-radius:14px;
  font-size:14px;
  font-weight:700;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}

/* PRINT */
@media print{
  body{background:#fff}
}
</style>
</head>

<body>

<header>
  <span class="badge">KGB</span>
  <strong>Proses Gaji Berkala</strong>
</header>

<div class="main">

  <div class="notice">
    ⚠️ <strong>PERHATIAN</strong><br>
    Golongan <strong>III/d – IV/a dan PPPK</strong>, setelah menerima
    <strong>Surat Pengantar</strong>, <strong>WAJIB mengisi Link KGB BKD</strong>.
  </div>

  <div class="actions">

    <a class="btn btn-kgb" target="_blank"
       href="https://script.google.com/macros/s/AKfycbxNBS7cj5Nin-zJCMA75Mw3qtG-Rgg6zN_PpgCTL_lzcAbh8VLM8ri9T4Q31vnoa8cf/exec">
      <span>Ajukan KGB</span>
      <small>STEP 1</small>
    </a>

    <a class="btn btn-bkd" target="_blank"
       href="https://www.pengadaanmutasiasnbkdkalbar.com">
      <span>Link KGB BKD</span>
      <small>STEP 2</small>
    </a>

  </div>

  <div class="info">
    ℹ️ Kontak & informasi lanjutan dapat diperoleh melalui BKD.
  </div>

</div>

</body>
</html>
