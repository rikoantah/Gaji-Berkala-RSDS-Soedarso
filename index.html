<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaji Berkala</title>

<style>
:root{
  --blue:#2563eb;
  --cyan:#0ea5e9;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* TOP BAR */
.topbar{
  position:sticky;
  top:0;
  background:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  z-index:10;
}

.back-btn{
  text-decoration:none;
  background:linear-gradient(135deg,#60a5fa,#2563eb);
  color:#fff;
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

.topbar strong{
  font-size:15px;
}

/* MAIN */
.main{
  max-width:520px;
  margin:0 auto;
  padding:28px 16px;
}

/* TITLE */
.title{
  text-align:center;
  margin-bottom:22px;
}

.title h1{
  margin:0;
  font-size:1.6rem;
  font-weight:800;
}

.title p{
  margin-top:6px;
  font-size:13px;
  color:#475569;
}

/* BUTTON GRID */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.btn{
  background:var(--card);
  border-radius:22px;
  padding:22px 18px;
  box-shadow:var(--shadow);
  text-decoration:none;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:16px;
  transition:.25s ease;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 30px rgba(0,0,0,.12);
}

.icon{
  width:56px;
  height:56px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  color:#fff;
  flex-shrink:0;
}

.i-blue{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.i-cyan{background:linear-gradient(135deg,#7dd3fc,#0ea5e9)}

.btn-text{
  font-size:16px;
  font-weight:800;
}

/* PRINT */
@media print{
  body{background:#fff}
  .topbar{box-shadow:none}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <a class="back-btn" href="https://rikoantah.github.io/Web-Utama-UMPAR/">← Back</a>
  <strong>Menu Utama</strong>
</div>

<!-- MAIN -->
<div class="main">

  <div class="title">
    <h1>Proses Gaji Berkala</h1>
    <p>Pilih layanan yang tersedia</p>
  </div>

  <div class="grid">

    <a class="btn" target="_blank"
       href="https://script.google.com/macros/s/AKfycbxNBS7cj5Nin-zJCMA75Mw3qtG-Rgg6zN_PpgCTL_lzcAbh8VLM8ri9T4Q31vnoa8cf/exec">
      <div class="icon i-blue">📝</div>
      <div class="btn-text">Step 1 Ajukan KGB</div>
    </a>

    <a class="btn" target="_blank"
       href="https://www.pengadaanmutasiasnbkdkalbar.com">
      <div class="icon i-cyan">🔗</div>
      <div class="btn-text">Step 2 Link KGB Resmi</div>
    </a>

  </div>

</div>

</body>
</html>
